<nav class="navbar glass-panel" aria-label="Navegacion principal">
  <a class="brand" href="/" aria-label="Inicio POS">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" role="img">
        <rect x="8" y="7" width="32" height="34" rx="7" />
        <path d="M15 17h18" />
        <path d="M15 24h18" />
        <path d="M16 32h6" />
        <path d="M27 32h5" />
        <circle cx="35" cy="13" r="5" />
      </svg>
    </span>
    <span>
      <strong>POS</strong>
      <small>{{ 'Punto de venta' | t }}</small>
    </span>
  </a>

  <div class="nav-actions">
    <select
      class="lang-select"
      [attr.aria-label]="'Idioma' | t"
      (change)="i18n.setLanguage($any($event.target).value)"
    >
      @for (language of languages; track language.code) {
        <option [value]="language.code" [selected]="language.code === i18n.language()">{{ language.code.toUpperCase() }}</option>
      }
    </select>
    @if (authService.isAuthenticated()) {
      @if (canViewAlerts()) {
        <div class="notifications-wrapper">
          <button class="btn btn-icon notifications-button" aria-label="Notificaciones" type="button" (click)="toggleNotifs()">
            <span class="notifications-icon" aria-hidden="true">🔔</span>
            @if (unreadNotifications() > 0) {
              <span class="notifications-badge">{{ unreadNotifications() }}</span>
            }
          </button>
          <div class="notifications-dropdown" [class.open]="notifsOpen()">
            <app-notification-center
              (closeRequested)="closeNotifs()"
              (unreadCountChange)="updateUnreadNotifications($event)"
              (incomingNotification)="actualizarAlertaEmergente($event)"
              (detailRequested)="abrirDetalleAlerta($event)"
            ></app-notification-center>
          </div>
        </div>
      }
      <button class="btn btn-danger" type="button" (click)="cerrarSesion()">{{ 'Cerrar sesion' | t }}</button>
    } @else {
      <a class="btn btn-secondary" routerLink="/register"> {{ 'Registrar' | t }} </a>
      <a class="btn btn-primary login-trigger" routerLink="/login">{{ 'Iniciar sesion' | t }}</a>
    }
  </div>
</nav>

@if (canViewAlerts()) {
  <app-notification-toast (detailRequested)="abrirDetalleAlerta($event)"></app-notification-toast>
  <app-notification-detail-modal
    [detail]="activeDetail"
    (closeRequested)="cerrarDetalleAlerta()"
  ></app-notification-detail-modal>
}
