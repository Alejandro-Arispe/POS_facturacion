<div class="page-container register-company-page">
  <app-navbar />

  <main class="register-company-shell">
    <section class="register-company-panel panel">
      <a class="back-link" routerLink="/my-companies">Volver a Mis empresas</a>

      <header class="register-company-header">
        <p class="badge badge-success">Administrador</p>
        <h1 class="title-xl">Registrar Nueva Empresa</h1>
        <p class="text-muted">Completa los datos principales de la empresa.</p>
      </header>

      @if (errorRegistro) {
        <p class="feedback feedback-error">{{ errorRegistro }}</p>
      }

      @if (mensajeRegistro) {
        <p class="feedback feedback-success">{{ mensajeRegistro }}</p>
      }

      <form
        class="company-form"
        aria-label="Formulario de registro de empresa"
        (submit)="registrarEmpresa($event)"
      >
        <div class="form-group">
          <label class="label" for="nombre">Nombre</label>
          <input
            class="input"
            id="nombre"
            name="nombre"
            type="text"
            placeholder="Cafe Norte"
            autocomplete="organization"
            required
            [(ngModel)]="form.nombre"
          />
        </div>

        <div class="form-group">
          <label class="label" for="razon_social">Razon social</label>
          <input
            class="input"
            id="razon_social"
            name="razon_social"
            type="text"
            placeholder="Cafe Norte Bolivia SA"
            required
            [(ngModel)]="form.razon_social"
          />
        </div>

        <div class="form-group">
          <label class="label" for="nit">NIT</label>
          <input
            class="input"
            id="nit"
            name="nit"
            type="text"
            placeholder="2045678912"
            inputmode="numeric"
            required
            [(ngModel)]="form.nit"
          />
        </div>

        <div class="form-group">
          <label class="label" for="correo">Correo</label>
          <input
            class="input"
            id="correo"
            name="correo"
            type="email"
            placeholder="admin@empresa.com"
            autocomplete="email"
            required
            [(ngModel)]="form.correo"
          />
        </div>

        <div class="company-form-actions">
          <a class="btn btn-secondary" routerLink="/my-companies">Cancelar</a>
          <button class="btn btn-primary" type="submit" [disabled]="cargandoRegistro">
            {{ cargandoRegistro ? 'Registrando...' : 'Registrar empresa' }}
          </button>
        </div>
      </form>
    </section>
  </main>
</div>
