<div class="page-container edit-category-page">
  <app-navbar />

  <main class="edit-category-layout">
    <app-sidebar context="company" [companyId]="companyId" />

    <section class="edit-category-content">
      <section class="edit-category-panel panel">
        <header class="edit-category-header">
          <p class="badge badge-success">Categoria {{ categoryId }}</p>
          <h1 class="title-xl">Editar Categoria de Cliente</h1>
          <p class="text-muted">Actualiza los datos de la categoria y guarda los cambios.</p>
        </header>

        @if (errorEdicion) {
          <p class="feedback feedback-error">{{ errorEdicion }}</p>
        }

        @if (mensajeEdicion) {
          <p class="feedback feedback-success">{{ mensajeEdicion }}</p>
        }

        @if (cargandoCategoria) {
          <p class="feedback feedback-info">Cargando datos de la categoria...</p>
        }

        <form class="category-form" (submit)="guardarCategoria($event)">
          <div class="form-group">
            <label class="label" for="categoria_nombre">Nombre</label>
            <input class="input" id="categoria_nombre" name="categoria_nombre" required [(ngModel)]="form.nombre" />
          </div>

          <div class="form-group">
            <label class="label" for="categoria_descripcion">Descripcion</label>
            <textarea
              class="textarea"
              id="categoria_descripcion"
              name="categoria_descripcion"
              rows="3"
              [(ngModel)]="form.descripcion"
            ></textarea>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="label" for="plazo_credito">Plazo de credito</label>
              <input
                class="input"
                id="plazo_credito"
                name="plazo_credito"
                type="number"
                min="0"
                step="1"
                [(ngModel)]="form.plazo_credito"
              />
            </div>

            <div class="form-group">
              <label class="label" for="descuento_base">Descuento base</label>
              <input
                class="input"
                id="descuento_base"
                name="descuento_base"
                type="number"
                min="0"
                step="0.01"
                [(ngModel)]="form.descuento_base"
              />
            </div>

            <div class="form-group">
              <label class="label" for="limite_credito">Limite de credito</label>
              <input
                class="input"
                id="limite_credito"
                name="limite_credito"
                type="number"
                min="0"
                step="0.01"
                [(ngModel)]="form.limite_credito"
              />
            </div>
          </div>

          <div class="form-group status-field">
            <span class="label">Estado</span>
            <label class="toggle-switch" for="categoria_activo">
              <input id="categoria_activo" name="categoria_activo" type="checkbox" [(ngModel)]="form.activo" />
              <span class="toggle-track" aria-hidden="true"></span>
              <span class="toggle-text">{{ form.activo ? 'Categoria activa' : 'Categoria inactiva' }}</span>
            </label>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit" [disabled]="cargandoCategoria || guardandoCategoria">
              {{ guardandoCategoria ? 'Guardando...' : 'Guardar categoria' }}
            </button>
            <button class="btn btn-secondary" type="button" (click)="volverListado()">Cancelar</button>
          </div>
        </form>
      </section>
    </section>
  </main>
</div>
