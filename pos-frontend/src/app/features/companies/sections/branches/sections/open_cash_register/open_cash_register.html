<div class="page-container open-cash-register-page">
  <app-navbar />

  <main class="open-cash-register-layout">
    <section class="open-cash-register-content">
      <section class="open-cash-register-header panel">
        <div>
          <p class="badge badge-success">Caja {{ cashRegisterId }}</p>
          <h1 class="title-xl">Abrir caja</h1>
          <p class="text-muted">Registra el monto inicial para comenzar una nueva sesion.</p>
        </div>
      </section>

      <section class="open-cash-register-panel panel">
        <form
          class="open-cash-register-form"
          aria-label="Formulario para abrir caja"
          (submit)="abrirCaja($event)"
        >
          @if (activeConflictSessionId) {
            <div class="feedback feedback-warning" style="margin-bottom: var(--space-md); display: flex; flex-direction: column; gap: var(--space-sm);">
              <p style="margin: 0; font-weight: 600;">
                {{ mensajeError }}
              </p>
              <div style="display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-top: var(--space-xs);">
                <a
                  class="btn btn-primary btn-sm"
                  [routerLink]="['/company', companyId, 'branch', branchId, 'cash-register', conflictCashRegisterId || cashRegisterId, 'sales']"
                  [queryParams]="{ sessionId: activeConflictSessionId }"
                >
                  Ingresar al POS (Ventas)
                </a>
                <a
                  class="btn btn-secondary btn-sm"
                  [routerLink]="['/company', companyId, 'branch', branchId, 'cash-register', conflictCashRegisterId || cashRegisterId, 'close-cash-register']"
                  [queryParams]="{ sessionId: activeConflictSessionId }"
                >
                  Cerrar Caja
                </a>
              </div>
            </div>
          } @else if (mensajeError) {
            <p class="feedback feedback-error" role="alert">{{ mensajeError }}</p>
          }

          <div class="form-grid">
            <div class="form-group">
              <label class="label" for="initial-amount">Monto inicial</label>
              <input
                class="input"
                id="initial-amount"
                name="initial-amount"
                type="number"
                min="0"
                step="0.01"
                placeholder="0.00"
                [(ngModel)]="initialAmount"
              />
            </div>

            <div class="form-group note-field">
              <label class="label" for="note">Nota</label>
              <textarea
                class="input textarea"
                id="note"
                name="note"
                rows="4"
                placeholder="Detalle opcional"
                [(ngModel)]="note"
              ></textarea>
            </div>
          </div>

          <div class="form-actions">
            <a
              class="btn btn-secondary"
              [routerLink]="['/company', companyId, 'branch', branchId, 'cash-register']"
            >
              Cancelar
            </a>
            <button class="btn btn-primary" type="submit" [disabled]="cargando">
              {{ cargando ? 'Abriendo...' : 'Abrir caja' }}
            </button>
          </div>
        </form>
      </section>
    </section>
  </main>
</div>
