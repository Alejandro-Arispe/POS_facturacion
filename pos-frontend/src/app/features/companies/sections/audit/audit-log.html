<div class="page-container audit-page">
  <app-navbar />

  <main class="audit-layout">
    <app-sidebar context="company" [companyId]="companyId" />

    <section class="audit-content">
      <header class="panel audit-header">
        <p class="badge badge-success">Empresa {{ companyId }}</p>
        <h1 class="title-xl">Bitácora de auditoría</h1>
        <p class="text-muted">
          Historial inalterable de inicios de sesión y operaciones realizadas en la empresa: quién hizo qué, cuándo y
          desde dónde.
        </p>
      </header>

      @if (error) {
        <p class="panel audit-error">{{ error }}</p>
      }

      <app-audit-table
        [items]="items"
        [total]="total"
        [loading]="loading"
        [filters]="filters"
        (filtersChange)="onFiltersChange($event)"
      />
    </section>
  </main>
</div>
