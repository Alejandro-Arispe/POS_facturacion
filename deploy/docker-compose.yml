# Despliegue en una sola instancia (EC2): frontend (nginx), backend Spring, analitica Python y Postgres.
# Uso: copiar deploy/.env.example a deploy/.env, completar los valores y ejecutar `docker compose up -d --build`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics:
    build: ../pos-backend/analytics
    restart: unless-stopped
    environment:
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY}

  backend:
    build: ../pos-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pos_db
      DB_USER: pos
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${PUBLIC_URL}
      FRONTEND_BASE_URL: ${PUBLIC_URL}
      ANALYTICS_URL: http://analytics:8001
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    volumes:
      - media:/app/media
      - xmls:/app/XMLS

  # El frontend se compila fuera del servidor (ng build necesita mas memoria que una instancia de 2 GB):
  #   cd pos-frontend && npx ng build --configuration production   (con apiBaseUrl = PUBLIC_URL)
  # y se copia dist/pos-frontend-web/browser a deploy/web. nginx reenvia /api, /media y /ws al backend.
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  media:
  xmls:
