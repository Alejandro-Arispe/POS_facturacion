server:
  port: 8000

spring:
  application:
    name: pos-backend-spring
  # Variables locales opcionales (claves de API, etc.) en un archivo .env junto al backend.
  config:
    import: optional:file:.env[.properties]
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:cinthiacarrasco321@gmail.com}
    password: ${SMTP_PASSWORD:hvrcljnmauvonfbo}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SMTP_USE_TLS:true}
          connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:10000}
          timeout: ${SMTP_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

app:
  auth:
    auto-activate-on-email-fail: true
  jwt:
    secret: ${JWT_SECRET_KEY:changeme-super-secret-key-change-in-production-32b}
    algorithm: ${JWT_ALGORITHM:HS256}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  verification:
    expiration-minutes: ${VERIFICATION_CODE_EXPIRATION_MINUTES:15}
    max-attempts: ${VERIFICATION_CODE_MAX_ATTEMPTS:3}
  invitation:
    expiration-hours: ${INVITATION_EXPIRATION_HOURS:72}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://pos-frontend-si2.duckdns.org}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  # Pasarela QR de la Billetera (sin URL ni claves el POS usa el QR y la tarjeta simulados).
  billetera:
    api-url: ${BILLETERA_API_URL:}
    api-key: ${BILLETERA_API_KEY:}
    webhook-secret: ${BILLETERA_WEBHOOK_SECRET:}
    acquirer-key: ${BILLETERA_ACQUIRER_KEY:}
  stripe:
    test-only: true
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail:
    # Envío real de correos: desactivado por defecto. Para activarlo, MAIL_ENABLED=true.
    enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:cinthiacarrasco321@gmail.com}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      # Modelo para el reconocimiento por camara (imagenes): rapido y multimodal.
      vision-model: ${GEMINI_VISION_MODEL:gemini-3.1-flash-lite}
  analytics:
    url: ${ANALYTICS_URL:http://localhost:8001}
    api-key: ${ANALYTICS_API_KEY:}
  firebase:
    # JSON de la cuenta de servicio de Firebase (proyecto atemporal-f0125).
    # Local: ../claves/firebase-key.json (carpeta ignorada por git). Docker: montado en /run/secrets.
    # Si el archivo no existe, el push queda desactivado (solo historial + WebSocket).
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:../claves/firebase-key.json}
  superadmin:
    email: ${SUPERADMIN_EMAIL:alejandro@gmail.com}
    password: ${SUPERADMIN_PASSWORD:}
  media-dir: ${MEDIA_DIR:media}
  xml-dir: ${XML_DIR:XMLS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
